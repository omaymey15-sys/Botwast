name: Clean and Build Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Fix gradlew permissions
      run: chmod +x gradlew
    
    - name: 🔥 SUPPRESSION du fichier problématique
      run: |
        echo "Suppression du fichier gradient_background.xml..."
        rm -f app/src/main/res/drawable/gradient_background.xml
        echo "Fichier supprimé avec succès !"
    
    - name: Vérification
      run: |
        echo "Contenu du dossier drawable :"
        ls -la app/src/main/res/drawable/ || echo "Dossier drawable vide ou inexistant"
    
    - name: Clean and build
      run: |
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk