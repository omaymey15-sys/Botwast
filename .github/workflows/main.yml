name: Supprimer définitivement le fichier corrompu

on:
  workflow_dispatch:

jobs:
  delete-file:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Supprimer le fichier du dépôt
      run: |
        git rm app/src/main/res/drawable/gradient_background.xml
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "Supprime gradient_background.xml corrompu"
        git push
    
    - name: Recréer le fichier propre
      run: |
        mkdir -p app/src/main/res/drawable
        cat > app/src/main/res/drawable/gradient_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <gradient
                android:type="linear"
                android:angle="90"
                android:startColor="#55555588"
                android:centerColor="#66666688"
                android:endColor="#77777788" />
        </shape>
        EOF
    
    - name: Ajouter le nouveau fichier
      run: |
        git add app/src/main/res/drawable/gradient_background.xml
        git commit -m "Ajoute gradient_background.xml propre"
        git push