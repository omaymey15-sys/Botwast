name: Clean and Build Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Fix gradlew permissions
      run: |
        echo "🔧 Correction des permissions de gradlew..."
        chmod +x gradlew
    
    - name: Clean resources directory
      run: |
        echo "🧹 Nettoyage du dossier drawable..."
        rm -f app/src/main/res/drawable/gradient_background.xml
        rm -f app/src/main/res/drawable/gradient_background.xml.bak
    
    - name: Create clean gradient_background.xml
      run: |
        echo "📝 Création d'un nouveau fichier gradient_background.xml propre..."
        cat > app/src/main/res/drawable/gradient_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <gradient
                android:type="linear"
                android:angle="90"
                android:startColor="#55555588"
                android:centerColor="#66666688"
                android:endColor="#77777788" />
        </shape>
        EOF
    
    - name: Verify file is correct
      run: |
        echo "✅ Vérification du fichier :"
        ls -la app/src/main/res/drawable/gradient_background.xml
        echo "📄 Contenu du fichier :"
        cat app/src/main/res/drawable/gradient_background.xml
    
    - name: Clean Gradle build cache
      run: |
        echo "🧹 Nettoyage du cache Gradle..."
        ./gradlew clean --no-daemon
        rm -rf .gradle
    
    - name: Suppress compileSdk warning
      run: |
        echo "🔧 Configuration gradle.properties..."
        if [ ! -f gradle.properties ]; then
          touch gradle.properties
        fi
        if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
        fi
    
    - name: Build debug APK
      run: |
        echo "🏗️ Construction de l'APK..."
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk