name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 🔥 SUPPRESSION DU FICHIER CORROMPU (ÉTAPE CRITIQUE)
      run: |
        echo "=== Suppression du fichier problématique ==="
        rm -vf app/src/main/res/drawable/gradient_background.xml
        echo ""
        echo "=== Vérification de la suppression ==="
        if [ -f "app/src/main/res/drawable/gradient_background.xml" ]; then
          echo "❌ Le fichier existe encore !"
          ls -la app/src/main/res/drawable/gradient_background.xml
          exit 1
        else
          echo "✅ Fichier supprimé avec succès"
        fi
        echo ""
        echo "=== Contenu du dossier drawable ==="
        ls -la app/src/main/res/drawable/ || echo "Dossier drawable est vide"
    
    - name: Fix gradlew permissions
      run: chmod +x gradlew
    
    - name: Build APK
      run: |
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk