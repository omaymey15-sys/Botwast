name: Créer fichier et builder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4
    
    - name: Configurer JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Créer le dossier drawable
      run: mkdir -p app/src/main/res/drawable
    
    - name: Créer gradient_background.xml proprement
      run: |
        cat > app/src/main/res/drawable/gradient_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <gradient
                android:type="linear"
                android:angle="90"
                android:startColor="#55555588"
                android:centerColor="#66666688"
                android:endColor="#77777788" />
        </shape>
        EOF
    
    - name: Vérifier le fichier créé
      run: |
        echo "=== Fichier gradient_background.xml ==="
        cat app/src/main/res/drawable/gradient_background.xml
        echo ""
        echo "=== Emplacement ==="
        ls -la app/src/main/res/drawable/
    
    - name: Réparer les permissions de gradlew
      run: chmod +x gradlew
    
    - name: Supprimer l'avertissement compileSdk
      run: |
        if [ ! -f gradle.properties ]; then
          touch gradle.properties
        fi
        if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
        fi
    
    - name: Nettoyer et builder l'APK
      run: |
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --no-daemon
    
    - name: Uploader l'APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk