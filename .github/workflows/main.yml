name: 🚀 Build APK Avancé

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      cleanBuild:
        description: 'Nettoyer avant de builder'
        required: true
        default: true
        type: boolean
      uploadArtifact:
        description: 'Uploader l'APK'
        required: true
        default: true
        type: boolean
  
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: 📦 Build Android APK
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        api-level: [33]
        target: [default]
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1
          cache-read-only: false
      
      - name: 🧹 Nettoyage (optionnel)
        if: inputs.cleanBuild == true || github.event_name == 'push'
        run: |
          echo "🧹 Nettoyage du projet..."
          chmod +x gradlew
          ./gradlew clean --no-daemon
          rm -rf .gradle
          echo "✅ Nettoyage terminé"
      
      - name: 🔧 Fix des permissions
        run: chmod +x gradlew
      
      - name: 📝 Configuration gradle.properties
        run: |
          echo "🔧 Configuration des propriétés..."
          {
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
            echo "android.suppressUnsupportedCompileSdk=34"
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.daemon=false"
          } >> gradle.properties
          cat gradle.properties
      
      - name: 🔍 Vérification des fichiers sources
        run: |
          echo "🔍 Vérification des fichiers problématiques..."
          if [ -f "app/src/main/res/drawable/gradient_background.xml" ]; then
            echo "⚠️ Fichier gradient_background.xml trouvé, vérification..."
            file app/src/main/res/drawable/gradient_background.xml
            head -c 100 app/src/main/res/drawable/gradient_background.xml | xxd
          else
            echo "✅ Aucun fichier problématique trouvé"
          fi
      
      - name: 🔨 Build APK ${{ inputs.buildType || 'debug' }}
        run: |
          echo "🏗️ Construction de l'APK en mode ${{ inputs.buildType || 'debug' }}..."
          
          if [ "${{ inputs.buildType }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          
          echo "✅ Build terminé !"
      
      - name: 📊 Analyse des résultats
        run: |
          echo "📊 Résultats du build :"
          echo "=== APK générés ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "=== Taille des APK ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec du -h {} \;
      
      - name: 📤 Upload APK
        if: inputs.uploadArtifact == true || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.buildType || 'debug' }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          compression-level: 6
      
      - name: 📱 Setup Android Emulator (optionnel)
        if: false
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: echo "Emulator ready"
      
      - name: 📈 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 📝 Générer des métadonnées
        run: |
          echo "📝 Génération des métadonnées..."
          {
            echo "## 📦 Informations du build"
            echo ""
            echo "- **Date**: $(date)"
            echo "- **Build Type**: ${{ inputs.buildType || 'debug' }}"
            echo "- **Run Number**: ${{ github.run_number }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo ""
            echo "### 📊 Statistiques"
            find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
          } > build_info.md
      
      - name: 📤 Upload des métadonnées
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build_info.md
          retention-days: 30

  notify:
    name: 📢 Notification
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Build Status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "🎉 Build réussi !"
          else
            echo "❌ Build échoué !"
          fi
