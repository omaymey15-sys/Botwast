name: Create file and build APK

on:
  workflow_dispatch:

jobs:
  create-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create gradient_background.xml
      run: |
        mkdir -p app/src/main/res/drawable
        cat > app/src/main/res/drawable/gradient_background.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <gradient
                android:type="linear"
                android:angle="90"
                android:startColor="#55555588"
                android:centerColor="#66666688"
                android:endColor="#77777788" />
        </shape>
        EOF
    
    - name: Fix gradlew permissions
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk