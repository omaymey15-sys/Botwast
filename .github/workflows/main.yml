name: Android CI - Fast Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - run: chmod +x gradlew

    # 🔥 CORRECTION ICI : On supprime l'étape qui cassait tout
    # (La ligne `rm -f app/src/main/res/layout/item_rule.xml` a été retirée)

    - run: ./gradlew assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: botwast-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk